name: Rust Cloud Compilation & Release

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux Static Binary (musl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust & musl toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Run Tests
        run: cargo test --all-features -- --nocapture

      - name: Compile Release Binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-rust-linux-musl
          path: target/x86_64-unknown-linux-musl/release/agent-rust

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Agent-Rust Latest Linux Release"
          files: target/x86_64-unknown-linux-musl/release/agent-rust
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
